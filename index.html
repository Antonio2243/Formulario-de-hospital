<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Ahorcado</title>
 
    <style>
        * {
            box-sizing: border-box;
        }
 
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
 
        .juego {
            background: white;
            width: 90%;
            max-width: 800px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            text-align: center;
        }
 
        h1 {
            color: #263238;
            margin-top: 0;
        }
 
        .contenido {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
 
        canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }
 
        #palabra {
            font-size: 35px;
            letter-spacing: 10px;
            margin: 25px 0;
            color: #222;
            min-height: 50px;
        }
 
        .info {
            min-width: 280px;
        }
 
        #letra {
            width: 70px;
            height: 45px;
            font-size: 25px;
            text-align: center;
            text-transform: uppercase;
            border: 2px solid #555;
            border-radius: 8px;
        }
 
        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
 
        button:hover {
            background: #0d47a1;
        }
 
        #mensaje {
            font-size: 22px;
            font-weight: bold;
            margin: 20px;
        }
 
        #letrasUsadas {
            color: #555;
            margin-top: 15px;
        }
 
        .ganaste {
            color: green;
        }
 
        .perdiste {
            color: red;
        }
    </style>
</head>
 
<body>
 
    <div class="juego">
 
        <h1>🎮 Juego del Ahorcado</h1>
 
        <div class="contenido">
 
            <canvas id="canvas" width="300" height="300"></canvas>
 
            <div class="info">
 
                <p>Adivina la palabra:</p>
 
                <div id="palabra"></div>
 
                <input
                    type="text"
                    id="letra"
                    maxlength="1"
                    autocomplete="off"
                >
 
                <br>
 
                <button onclick="adivinarLetra()">
                    Adivinar letra
                </button>
 
                <button onclick="nuevoJuego()">
                    Nuevo juego
                </button>
 
                <p id="letrasUsadas">
                    Letras usadas: ninguna
                </p>
 
                <p id="errores">
                    Errores: 0 / 6
                </p>
 
                <div id="mensaje"></div>
 
            </div>
 
        </div>
 
    </div>
 
    <script src="juego.js"></script>
 
</body>
</html>
